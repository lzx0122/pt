<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>行人軌跡</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
    <link rel="stylesheet" href="./src/loadingModal.css" />
    <link rel="stylesheet" href="./src/reset.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div
      id="header"
      class="position-fixed top-0 start-0 w-100 bg-dark text-white p-3 d-flex flex-column flex-md-row justify-content-between align-items-center rounded-bottom shadow-lg"
      style="height: 60px"
    >
      <!-- 左側的文字顯示區 -->
      <div
        id="text"
        class="h6 mb-0 text-light text-center text-md-start mb-2 mb-md-0 w-100 w-md-auto text-truncate"
        style="max-width: 60%"
      >
        <!-- 這裡將顯示預測訊息 -->
        預測約 5.6 秒後，行人1 將進入警示區！
      </div>

      <!-- 右側的控制區塊 - 調整內部排列 -->
      <div
        id="controls"
        class="d-flex flex-wrap justify-content-center justify-content-md-end align-items-center gap-2 gap-md-3 w-100 w-md-auto"
      >
        <!-- 秒數顯示組 -->
        <div class="d-flex align-items-center">
          <span class="text-nowrap fw-bold me-1">秒數:</span>
          <span
            id="sec"
            class="badge bg-success fs-6 px-2 py-1 rounded-pill shadow-sm"
            >0</span
          >
        </div>

        <!-- 速度控制和視角切換組 -->
        <div class="d-flex align-items-center">
          <label for="speed" class="form-label mb-0 text-nowrap fw-bold me-1"
            >速度</label
          >
          <input
            type="number"
            name="speed"
            id="speed"
            value="10"
            max="60"
            min="1"
            class="form-control form-control-sm w-auto shadow-sm"
            style="max-width: 70px; margin-right: 0.5rem"
          />
          <input
            type="checkbox"
            id="perspective"
            class="form-check-input my-0 shadow-sm"
          />
          <label for="perspective" class="form-check-label text-nowrap ms-1"
            >視角</label
          >
        </div>

        <!-- 操作按鈕組 -->
        <div class="d-flex align-items-center gap-2">
          <input
            type="button"
            id="restart"
            class="btn btn-outline-light btn-sm shadow-sm"
            value="重新整理"
          />
          <input
            type="button"
            id="start"
            class="btn btn-primary btn-sm shadow-sm"
            value="開始模擬"
          />
        </div>
      </div>
    </div>
    <div id="warning"></div>

    <div
      id="loading-list-container"
      class="position-fixed bottom-0 end-0 m-4 bg-dark bg-opacity-75 p-4 rounded-3 shadow-lg text-white z-50 fade-transition"
    >
      <h2 class="fs-5 fw-bold mb-3 text-center">加載清單</h2>
      <div
        id="loading-items"
        class="d-flex flex-column gap-2 loading-list-scrollable"
      ></div>
    </div>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
